services:
  # 1. Database NoSQL: MongoDB 7.0 (Replica Set for Prisma, loopback-only)
  mongo:
    image: mongo:7.0
    container_name: petcare_mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --port 27017 --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}).ok }" --quiet
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
    networks:
      - petcare-network

  # 2. AI Demand Forecasting Microservice (Python FastAPI + Scikit-Learn)
  ai-service:
    image: ghcr.io/duongcongvinh/petcaremanagement-ai-service:latest
    container_name: petcare_ai_service
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - petcare-network

  # 3. Core Business Backend (Node.js Express + Prisma ORM)
  backend:
    image: ghcr.io/duongcongvinh/petcaremanagement-backend:latest
    container_name: petcare_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mongodb://mongo:27017/petcare_db?replicaSet=rs0&directConnection=true"
      JWT_SECRET: "${JWT_SECRET:-super_secret_petcare_jwt_key_2026}"
      AI_SERVICE_URL: "http://ai-service:8000"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - petcare-network

  # 4. Frontend SPA (React + Vite built & served via Nginx behind Caddy on 127.0.0.1:3000)
  frontend:
    image: ghcr.io/duongcongvinh/petcaremanagement-frontend:latest
    container_name: petcare_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - petcare-network

volumes:
  mongo_data:
    driver: local

networks:
  petcare-network:
    driver: bridge
