name: PETZERA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== 1. CI: FRONTEND ====================
  ci-frontend:
    name: CI - Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  # ==================== 2. CI: BACKEND ====================
  ci-backend:
    name: CI - Backend (Express + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate & Generate Prisma Client
        env:
          DATABASE_URL: "mongodb://localhost:27017/petcare_ci"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Syntax check Backend JS files
        run: find src -name "*.js" -exec node --check {} +

      - name: Run Backend unit tests
        run: npm test

  # ==================== 3. CI: AI SERVICE ====================
  ci-ai-service:
    name: CI - AI Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax & App Import Check
        run: |
          python -m py_compile main.py
          python -c "import main; assert main.app is not None"

      - name: Run AI Service unit tests
        run: |
          pip install pytest httpx
          pytest -v

  # ==================== 4. CD: BUILD & PUSH DOCKER IMAGES ====================
  build-and-push:
    name: CD - Build & Push Docker Images
    needs: [ci-frontend, ci-backend, ci-ai-service]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
