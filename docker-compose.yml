services:
  # 1. Database NoSQL: MongoDB (Configured with Replica Set for Prisma)
  mongo:
    image: mongo:7.0
    container_name: petcare_mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --port 27017 --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}).ok }" --quiet
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
    networks:
      - petcare-network

  # 2. Web UI Quản lý dữ liệu trực quan: Mongo Express (http://localhost:8081)
  mongo-express:
    image: mongo-express:latest
    container_name: petcare_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - petcare-network

  # 3. AI Demand Forecasting Microservice (Python FastAPI + Scikit-Learn)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: petcare_ai_service
    restart: always
    ports:
      - "8000:8000"
    networks:
      - petcare-network

  # 4. Core Business Backend (Node.js Express + Prisma ORM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petcare_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "mongodb://mongo:27017/petcare_db?replicaSet=rs0&directConnection=true"
      JWT_SECRET: "super_secret_petcare_jwt_key_2026"
      AI_SERVICE_URL: "http://ai-service:8000"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
    networks:
      - petcare-network

  # 5. Frontend Single Page Application (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petcare_frontend
    restart: always
    environment:
      BACKEND_PROXY_URL: "http://backend:5000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - petcare-network

volumes:
  mongo_data:
    driver: local

networks:
  petcare-network:
    driver: bridge
